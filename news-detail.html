                            <h1 className="text-3xl md:text-4xl font-bold text-slate-900 mb-4">{news.title}</h1>
                            <div className="flex items-center gap-4 text-sm text-slate-400 mb-8">
                                <span>{news.date}</span>
                                <span>中科之家</span>
                            </div>

                            {/* 封面图 */}
                            <div className="rounded-2xl overflow-hidden mb-10 shadow-lg bg-white">
                                <img src={news.image} alt={news.title} className="w-full h-auto object-contain" />
                            </div>

                            {/* 正文 */}
                            <div className="prose prose-lg max-w-none">
                                {paragraphs.map((p, i) => (
                                    <p key={i} className="text-slate-700 leading-relaxed mb-6 first-line:indent-8">{p}</p>
                                ))}
                            </div>

                            {/* 返回按钮 */}
                            <div className="mt-12 pt-8 border-t border-slate-200">
                                <a href="news.html" className="inline-flex items-center gap-2 text-blue-600 font-medium hover:gap-3 transition-all">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="15 18 9 12 15 6"/></svg>
                                    返回新闻列表
                                </a>
                            </div>
                        </div>
                    </div>

                    {/* 底部 */}
                    <footer className="bg-slate-900 text-slate-300 py-12 border-t border-slate-800">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
                            <p className="text-sm">© 2026 中科之家 版权所有</p>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<NewsDetailPage />);
    </script>
</body>
</html>
