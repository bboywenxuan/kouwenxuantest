        // -----------------------------------------------------
        // 2. 主体 React 应用代码
        // -----------------------------------------------------
        const { useState, useEffect, useCallback } = React;

        const App = () => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [formData, setFormData] = useState({ name: '', phone: '', city: '' });
            const [formStatus, setFormStatus] = useState({ type: '', message: '' });
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [selectedHonor, setSelectedHonor] = useState(null);
            const [activeSection, setActiveSection] = useState('home');
            const [scrolled, setScrolled] = useState(false);
            const [captcha, setCaptcha] = useState({ question: '', answer: 0, input: '' });
            const [showSuccessModal, setShowSuccessModal] = useState(false);
            const [openFaqIndex, setOpenFaqIndex] = useState(null);

            const generateCaptcha = useCallback(() => {
                const operators = ['+', '-', '×'];
                const op = operators[Math.floor(Math.random() * operators.length)];
                let a, b, answer;
                if (op === '+') {
                    a = Math.floor(Math.random() * 20) + 1;
                    b = Math.floor(Math.random() * 20) + 1;
                    answer = a + b;
                } else if (op === '-') {
                    a = Math.floor(Math.random() * 20) + 10;
                    b = Math.floor(Math.random() * 10) + 1;
                    answer = a - b;
                } else {
                    a = Math.floor(Math.random() * 9) + 2;
                    b = Math.floor(Math.random() * 9) + 2;
                    answer = a * b;
                }
                setCaptcha({ question: `${a} ${op} ${b} = ?`, answer, input: '' });
            }, []);

            useEffect(() => {
                generateCaptcha();
            }, [generateCaptcha]);

            // 滚动监听 — 导航高亮 + 悬浮CTA显隐
            useEffect(() => {
                const sections = ['home','about','team','executives','solutions','franchise'];
                const observer = new IntersectionObserver(
                    (entries) => {
                        entries.forEach(entry => {
                            if (entry.isIntersecting) setActiveSection(entry.target.id);
                        });
                    },
                    { rootMargin: '-40% 0px -55% 0px' }
                );
                sections.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) observer.observe(el);
                });
                const onScroll = () => setScrolled(window.scrollY > 400);
                window.addEventListener('scroll', onScroll, { passive: true });
                return () => {
                    observer.disconnect();
                    window.removeEventListener('scroll', onScroll);
                };
            }, []);

            // 滚动入场动效
            useEffect(() => {
                const observer = new IntersectionObserver(
                    (entries) => {
                        entries.forEach(entry => {
                            if (entry.isIntersecting) {
                                entry.target.classList.add('revealed');
                                observer.unobserve(entry.target);
                            }
                        });
                    },
                    { threshold: 0.1, rootMargin: '0px 0px -40px 0px' }
                );
                document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
                return () => observer.disconnect();
            }, []);

            const handleSubmit = async (e) => {
                e.preventDefault();
                
                if (parseInt(captcha.input) !== captcha.answer) {
                    setFormStatus({ type: 'error', message: '验证码错误，请重新计算' });
                    generateCaptcha();
                    return;
                }

                setFormStatus({ type: 'loading', message: '提交中...' });
                try {
                    const res = await fetch('/api/franchise', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ...formData, captcha: captcha.input })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        setFormStatus({ type: 'success', message: data.message });
                        setFormData({ name: '', phone: '', city: '' });
                        setCaptcha(prev => ({ ...prev, input: '' }));
                        setShowSuccessModal(true);
                        setTimeout(() => setShowSuccessModal(false), 5000);
                    } else {
                        setFormStatus({ type: 'error', message: data.error || '提交失败' });
                        generateCaptcha();
                    }
                } catch (err) {
                    setFormStatus({ type: 'error', message: '网络错误，请稍后重试' });
                    generateCaptcha();
                }
            };

            const navLinks = [

                                <svg className="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M10.09 18.78c-4.52.45-8.36-1.6-8.57-4.56-.21-2.96 3.27-5.94 7.79-6.39 4.52-.45 8.36 1.6 8.57 4.56.21 2.96-3.27 5.94-7.79 6.39zm4.52-8.24c-.24-1.73-1.76-2.94-3.4-2.7-1.64.24-2.78 1.83-2.54 3.56.24 1.73 1.76 2.94 3.4 2.7 1.64-.24 2.78-1.83 2.54-3.56zM20.1 9.16c-.18-.54-.78-.84-1.32-.66-.54.18-.84.78-.66 1.32.54 1.62.36 3.42-.54 4.86-.9 1.44-2.46 2.34-4.14 2.52-.18.02-.36.03-.54.03-1.5 0-2.94-.66-3.96-1.8-.18-.2-.16-.5.04-.68.2-.18.5-.16.68.04.84.94 2.04 1.44 3.3 1.44.15 0 .3 0 .45-.02 1.38-.15 2.64-.87 3.36-2.04.72-1.17.87-2.64.42-3.96-.18-.54-.78-.84-1.32-.66-.54.18-.84.78-.66 1.32.3.9.18 1.92-.36 2.76-.54.84-1.44 1.38-2.46 1.5-.12.01-.24.02-.36.02-1.02 0-1.98-.42-2.64-1.14-.18-.2-.16-.5.04-.68.2-.18.5-.16.68.04.48.54 1.14.84 1.86.84.09 0 .18 0 .27-.01.72-.08 1.38-.48 1.74-1.08.36-.6.42-1.32.18-1.98z"/></svg>
                            </a>
                            <a href="#" className="w-10 h-10 bg-slate-800 hover:bg-green-600 rounded-full flex items-center justify-center transition-colors" title="微信">
                                <Wechat className="w-5 h-5" />
                            </a>
                        </div>
                        </div>
                        
                        <div>
                        <h4 className="text-white font-bold mb-6 text-lg">快速链接</h4>
                        <ul className="space-y-4">
                            {navLinks.map(link => (
                            <li key={link.name}>
                                <a href={link.href} className="hover:text-blue-400 transition-colors flex items-center gap-2">
                                <ChevronRight className="w-4 h-4" /> {link.name}
                                </a>
                            </li>
                            ))}
                        </ul>
                        </div>

                        <div>
                        <h4 className="text-white font-bold mb-6 text-lg">联系我们</h4>
                        <ul className="space-y-4">
                            <li className="flex items-start gap-3">
                            <MapPin className="w-5 h-5 text-blue-500 flex-shrink-0 mt-1" />
                            <span>上海市徐汇区漕溪北路18号<br/>上海实业大厦8层8C室</span>
                            </li>
                            <li className="flex items-center gap-3">
                            <Phone className="w-5 h-5 text-blue-500 flex-shrink-0" />
                            <div>
                                <div>021-34622630</div>
                                <div>021-62884089</div>
                            </div>
                            </li>
                            <li className="flex items-center gap-3">
                            <Mail className="w-5 h-5 text-blue-500 flex-shrink-0" />
                            <span>business@hengtong.com</span>
                            </li>
                        </ul>
                        </div>
                    </div>
                    
                    <div className="border-t border-slate-800 pt-8 flex flex-col md:flex-row justify-between items-center gap-4">
                        <p className="text-sm text-slate-500">
                        © 2026 上海衡通之家科技有限公司. 保留所有权利.
                        </p>
                        <div className="text-sm text-slate-500 flex space-x-4">
                        <a href="/privacy.html" className="hover:text-white" rel="noopener">隐私政策</a>
                        <a href="/terms.html" className="hover:text-white" rel="noopener">服务条款</a>
                        <a href="https://beian.miit.gov.cn/" className="hover:text-white" target="_blank" rel="noopener">沪ICP备xxxxxxxx号</a>
                        </div>
                    </div>
                    </div>
                </footer>

                {/* 产品详情弹窗 */}
                {selectedProduct && (
                    <div className="fixed inset-0 z-[60] flex items-center justify-center p-4" onClick={() => setSelectedProduct(null)}>
                        <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" />
                        <div className="relative bg-white rounded-3xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-8 z-10" onClick={e => e.stopPropagation()}>
                            <div className="flex items-start justify-between mb-6">
                                <div className="flex items-center gap-4">
                                    <div className="w-14 h-14 bg-slate-50 rounded-2xl flex items-center justify-center">
                                        {selectedProduct.icon}
                                    </div>
                                    <div>
                                        <h3 className="text-2xl font-bold text-slate-900">{selectedProduct.name}</h3>
                                        <p className="text-2xl font-bold text-blue-600 mt-1">{selectedProduct.price}</p>
                                    </div>
                                </div>
                                <button onClick={() => setSelectedProduct(null)} className="w-10 h-10 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center flex-shrink-0 transition-colors">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                                </button>
                            </div>

                            <div className="mb-6">
                                <h4 className="text-sm font-bold text-slate-500 uppercase tracking-wider mb-3">产品详情</h4>
                                <p className="text-slate-600 leading-relaxed">{selectedProduct.detail}</p>
                            </div>

                            <div className="mb-6">
                                <h4 className="text-sm font-bold text-slate-500 uppercase tracking-wider mb-3">适用人群</h4>
                                <p className="text-slate-600">{selectedProduct.suitable}</p>
                            </div>

                            <div className="mb-6">
                                <h4 className="text-sm font-bold text-slate-500 uppercase tracking-wider mb-3">技术规格</h4>
                                <div className="flex flex-wrap gap-2">
                                    {selectedProduct.specs.map((spec, i) => (
                                        <span key={i} className="px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-600">{spec}</span>
                                    ))}
                                </div>
                            </div>

                            <div className="border-t border-slate-100 pt-6">
                                <h4 className="text-sm font-bold text-slate-500 uppercase tracking-wider mb-3">核心卖点</h4>
                                <ul className="space-y-2">
                                    {selectedProduct.features.map((f, i) => (
                                        <li key={i} className="flex items-center gap-3 text-slate-600">
                                            <CheckCircle2 className="w-5 h-5 text-green-500 flex-shrink-0" />
                                            <span>{f}</span>
                                        </li>
                                    ))}
                                </ul>
                            </div>

                            <div className="mt-8 pt-6 border-t border-slate-100">
                                <a href="#franchise" onClick={() => setSelectedProduct(null)} className="block w-full py-3.5 bg-blue-600 text-white rounded-xl font-bold text-center hover:bg-blue-700 transition-colors shadow-lg shadow-blue-600/20">
                                    咨询加盟 · 获取详细报价
                                </a>
                            </div>
                        </div>
                    </div>
                )}

                </div>
            );
        };

        // -----------------------------------------------------
        // 3. 渲染应用
        // -----------------------------------------------------
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
